<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Burnpad on Devnet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Ember on ink. A blue-black ground so the orange only ever means "burn": the vault
   meters, the burn button, the burned totals. Steel blue is for the curve and links.
   Bricolage Grotesque for headlines and big numbers, Plex Sans for reading. One dark theme. */
:root {
  --paper: #0D1017;
  --surface: #141925;
  --raised: #1C2333;
  --ink: #ECE8DF;
  --muted: #8E98AD;
  --line: #262F44;
  --flame: #FF7B3A;
  --flame-soft: #2A1A12;
  --scorch: #FFA766;
  --curve: #6FA8FF;
  --good: #7BD389;
  --bad: #FF8A80;
  --display: "Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 400 15px/1.5 var(--body); }
h1, h2, h3 { font-family: var(--display); font-weight: 800; line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: clamp(30px, 4.4vw, 48px); } h2 { font-size: 22px; } h3 { font-size: 17px; font-weight: 500; }
p { margin: 0; } a { color: var(--curve); }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--flame); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; } .muted { color: var(--muted); } .small { font-size: 13px; }
.mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; overflow-wrap: anywhere; }

.banner { background: var(--flame-soft); color: var(--scorch); border-bottom: 1px solid #4A2C1B; padding: 7px 20px; font-size: 13px; font-weight: 500; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.mark { font: 800 22px var(--display); text-decoration: none; color: var(--ink); }
.mark span { font: 400 12px var(--body); color: var(--muted); margin-left: 6px; } .mark em { font-style: normal; color: var(--flame); }
.nav { display: flex; flex-wrap: wrap; gap: 2px; flex: 1; }
.nav a { padding: 6px 10px; border-radius: 8px; text-decoration: none; color: var(--muted); font-weight: 500; }
.nav a:hover { color: var(--ink); }
.nav a[aria-current="page"] { background: var(--raised); color: var(--ink); }

main { max-width: 1120px; margin: 0 auto; padding: 28px 20px 64px; display: flex; flex-direction: column; gap: 24px; }
.btn { border: 1px solid var(--line); background: var(--raised); color: var(--ink); padding: 9px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
.btn:hover { border-color: var(--muted); }
.btn.flame { background: var(--flame); border-color: var(--flame); color: #1A0E06; }
.btn.flame:hover { filter: brightness(1.08); }
.btn.sm { padding: 5px 10px; font-size: 13px; font-weight: 500; }
.btn[disabled] { opacity: .4; cursor: not-allowed; filter: none; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 24px; min-width: 0; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.hero { display: flex; flex-direction: column; gap: 16px; padding: 12px 0 4px; }
.hero p { max-width: 60ch; color: var(--muted); font-size: 17px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.stats div { background: var(--surface); padding: 14px 16px; color: var(--muted); }
.stats b { display: block; font: 800 26px var(--display); color: var(--ink); }

.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; cursor: pointer; font-weight: 500; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--flame); }
.trow { display: grid; grid-template-columns: minmax(170px, 1.5fr) minmax(160px, 1.5fr) repeat(2, minmax(90px, .7fr)); gap: 16px; align-items: center; padding: 13px 8px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); border-radius: 8px; }
a.trow:hover { background: var(--raised); }
.trow.head { color: var(--muted); font-size: 13px; padding-block: 6px; }
@media (max-width: 700px) { .trow { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .trow.head { display: none; } }
.tok { display: flex; gap: 12px; align-items: center; min-width: 0; } .tok b { display: block; overflow-wrap: anywhere; }
.av { width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center; font: 700 17px var(--display); background: var(--raised); border: 1px solid var(--line); object-fit: cover; }
.av.big { width: 64px; height: 64px; font-size: 26px; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; border: 1px solid currentColor; }
.pill.grad { color: var(--good); } .pill.curve { color: var(--curve); } .pill.off { color: var(--muted); }
.prog { height: 8px; background: var(--raised); border-radius: 4px; overflow: hidden; } .prog.big { height: 14px; border-radius: 7px; }
.prog i { display: block; height: 100%; background: var(--curve); } .prog.vault i { background: linear-gradient(90deg, #FF7B3A, #FFB36B); }

.cols { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 900px) { .cols { grid-template-columns: minmax(0, 1fr); } }
dl { margin: 0; } .kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 7px 16px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.field { display: flex; flex-direction: column; gap: 5px; } .field label { font-size: 13px; font-weight: 500; color: var(--muted); }
input[type="text"], input[type="number"], input[type="url"], input[type="file"], textarea { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; width: 100%; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 16px; cursor: pointer; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.quote { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 14px; min-height: 44px; }
.note { border-left: 3px solid var(--scorch); padding: 2px 0 2px 12px; font-size: 14px; color: var(--muted); }
.msg { padding: 11px 14px; border-radius: 8px; background: var(--flame-soft); border: 1px solid var(--flame); overflow-wrap: anywhere; }
.msg.bad { background: transparent; border-color: var(--bad); color: var(--bad); }
.msg.good { background: transparent; border-color: var(--good); color: var(--good); }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; max-width: 68ch; }

.search { flex: 1 1 220px; max-width: 360px; position: relative; }
.search input { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.heroGrid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 32px; align-items: center; padding: 18px 0 6px; }
@media (max-width: 900px) { .heroGrid { grid-template-columns: minmax(0, 1fr); } }
.heroGrid h1 { font-size: clamp(34px, 5vw, 58px); letter-spacing: -0.02em; }
.heroGrid p { color: var(--muted); font-size: 17px; max-width: 54ch; }
.stats3 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.stats3 > div { background: var(--surface); padding: 14px 18px; color: var(--muted); font-size: 13px; }
.stats3 > div.wide { grid-column: 1 / -1; padding: 18px; background: linear-gradient(135deg, #1D1812, var(--surface) 70%); }
.stats3 b { display: block; font: 800 28px var(--display); color: var(--ink); line-height: 1.15; }
.stats3 .wide b { font-size: 44px; color: var(--scorch); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.card { display: flex; flex-direction: column; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; text-decoration: none; color: var(--ink); }
.card:hover { border-color: #3A4766; background: #171D2B; }
.card .top2 { display: flex; gap: 11px; align-items: center; justify-content: space-between; }
.card dl { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
.card dt { font-size: 12px; color: var(--muted); } .card dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.card dd.burn { color: var(--scorch); }
.lb { width: 100%; border-collapse: collapse; }
.lb th { text-align: right; font-weight: 500; font-size: 13px; color: var(--muted); padding: 6px 10px; border-bottom: 1px solid var(--line); }
.lb th:nth-child(-n+2) { text-align: left; }
.lb td { padding: 12px 10px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; }
.lb td:nth-child(-n+2) { text-align: left; }
.lb tr.hit:hover { background: var(--raised); cursor: pointer; }
.lb .rk { width: 34px; color: var(--muted); font: 800 16px var(--display); }
.lb td.burn { color: var(--scorch); font-weight: 600; }
.lb a { color: var(--ink); text-decoration: none; font-weight: 600; }
@media (max-width: 700px) { .lb th:nth-child(5), .lb td:nth-child(5), .lb th:nth-child(6), .lb td:nth-child(6) { display: none; } }
@media (prefers-reduced-motion: no-preference) { .prog i { transition: width .4s ease; } }
</style>
</head>
<body>
<div class="banner">Running on Solana devnet. Tokens and SOL here are test assets with no value.</div>
<header class="top">
  <a class="mark" href="#tokens">Burn<em>pad</em><span>working name</span></a>
  <div class="search"><input type="search" id="q" placeholder="Search by name, ticker or address" aria-label="Search tokens"></div>
  <nav class="nav" id="nav" aria-label="Main"></nav>
  <div class="row" id="wallet"></div>
</header>
<main>
  <div id="msg" role="status" aria-live="polite"></div>
  <div id="view" class="stack"></div>
</main>

<script src="config.js"></script>
<script src="https://unpkg.com/@solana/web3.js@1.95.3/lib/index.iife.min.js"></script>
<script>
const API = (window.API_URL || '').replace(/\/$/, '');
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fSol = (x) => (x === 0 ? '0' : Math.abs(x) >= 100 ? x.toFixed(1) : Math.abs(x) >= 1 ? x.toFixed(2) : Math.abs(x) >= 0.0001 ? x.toFixed(4) : x.toFixed(8).replace(/0+$/, '')) + ' SOL';
const fTok = (x) => x >= 1e9 ? (x / 1e9).toFixed(2) + 'B' : x >= 1e6 ? (x / 1e6).toFixed(2) + 'M' : x >= 1e3 ? (x / 1e3).toFixed(1) + 'K' : (+x).toFixed(x < 10 && x > 0 ? 2 : 0);
const fPrice = (x) => x == null ? 'n/a' : (x * 1e6).toFixed(4);
const short = (a) => a.slice(0, 4) + '…' + a.slice(-4);
const ago = (ms) => { const m = (Date.now() - ms) / 60000; return m < 1 ? 'just now' : m < 60 ? Math.round(m) + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' d ago'; };
const explorer = (kind, id) => 'https://explorer.solana.com/' + kind + '/' + encodeURIComponent(id) + '?cluster=devnet';

let S = { cfg: null, tokens: [], loaded: false, loadError: null, owner: null, sol: null, held: {}, tab: 'new', q: '', vsort: 'sol', side: 'buy', amt: '0.1', busy: false, vamt: '', vq: null, launch: { name: '', symbol: '', desc: '', first: '', target: '85', imageUrl: '' } };
let wallet = null, quoteTimer = null, quoteSeq = 0, vTimer = null, vSeq = 0;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/* ---------- API and wallet ---------- */
async function api(path, body) {
  let res;
  try { res = await fetch(API + path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : undefined); }
  catch (e) { throw new Error('Could not reach the server. Check your connection and try again.'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'The server returned an error (' + res.status + ').');
  return data;
}
function say(html, kind) { $('msg').innerHTML = html ? '<div class="msg ' + (kind || '') + '">' + html + '</div>' : ''; if (html) window.scrollTo({ top: 0, behavior: 'smooth' }); }
function wallets() {
  const list = [];
  if (window.phantom && window.phantom.solana) list.push(['Phantom', window.phantom.solana]);
  if (window.solflare && window.solflare.isSolflare) list.push(['Solflare', window.solflare]);
  if (window.backpack && window.backpack.solana) list.push(['Backpack', window.backpack.solana]);
  return list;
}
async function connect(provider, quiet) {
  try {
    const r = await provider.connect(quiet ? { onlyIfTrusted: true } : undefined);
    wallet = provider; S.owner = ((r && r.publicKey) || provider.publicKey).toString();
    if (!quiet) say('');
    await refreshMine(); render();
  } catch (e) { if (!quiet) say('The wallet did not connect: ' + esc(e.message || e), 'bad'); }
}
function startConnect() {
  const list = wallets();
  if (!list.length) return say('No Solana wallet found in this browser. Install Phantom, Solflare or Backpack, then reload this page.', 'bad');
  if (list.length === 1) return connect(list[0][1]);
  say('Choose a wallet: ' + list.map((w, i) => '<button class="btn sm" data-act="pick" data-v="' + i + '">' + w[0] + '</button>').join(' '));
}
const fromB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const toB64 = (bytes) => { let s = ''; bytes.forEach((b) => (s += String.fromCharCode(b))); return btoa(s); };

/* Sign what the server built in the wallet, then hand it back to be sent. */
async function signSend(label, built, extra) {
  say(esc(label) + ': approve it in your wallet. If no window appears, click the wallet’s icon in your browser toolbar.');
  const txs = built.transactions.map((b) => solanaWeb3.VersionedTransaction.deserialize(fromB64(b)));
  const signed = txs.length > 1 ? await wallet.signAllTransactions(txs) : [await wallet.signTransaction(txs[0])];
  say(esc(label) + ': sending to devnet and waiting for confirmation…');
  const sent = await api('/tx/send', { transactions: signed.map((t) => toB64(t.serialize())), ...(extra || {}) });
  say(esc(label) + ' confirmed. ' + sent.signatures.map((s) => '<a href="' + explorer('tx', s) + '" rel="noopener">View on Solana Explorer</a>').join(' '), 'good');
  return sent;
}
function guard() {
  if (S.busy) return false;
  if (!S.owner) { say('Connect your wallet first.', 'bad'); return false; }
  return true;
}
/* Ask the server for unsigned transactions, sign in the wallet, hand back to be sent. */
async function run(label, path, body) {
  if (!guard()) return null;
  S.busy = true;
  try {
    say(esc(label) + ': preparing the transaction…');
    const built = await api(path, { owner: S.owner, ...body });
    await signSend(label, built, { mint: built.mint });
    S.busy = false;
    await refresh();
    return built;
  } catch (e) {
    say(esc(e && e.message ? e.message : e), 'bad');
    return null;
  } finally { S.busy = false; }
}
/* A launch is two transactions: register the token and its platform, then create the curve. */
async function launchFlow(label, body) {
  if (!guard()) return null;
  S.busy = true;
  try {
    say(esc(label) + ', step 1 of 2: preparing…');
    const first = await api('/tx/launch', { owner: S.owner, ...body });
    await signSend(label + ', step 1 of 2', first, {});
    let second = null;
    for (let i = 0; i < 8 && !second; i++) {
      try { second = await api('/tx/launch-pool', { owner: S.owner, mint: first.mint }); }
      catch (e) { if (i === 7) throw e; await sleep(3000); }
    }
    await signSend(label + ', step 2 of 2', second, { mint: first.mint });
    S.busy = false;
    await refresh();
    return first;
  } catch (e) {
    say(esc(e && e.message ? e.message : e), 'bad');
    return null;
  } finally { S.busy = false; }
}

/* ---------- Data ---------- */
async function refreshMine() {
  if (!S.owner) return;
  try {
    const t = current();
    const b = await api('/balance?owner=' + encodeURIComponent(S.owner) + (t && t.mint ? '&mint=' + encodeURIComponent(t.mint) : ''));
    S.sol = b.sol; if (t && t.mint && b.tokens != null) S.held[t.mint] = b.tokens;
  } catch (e) { /* balance is a convenience */ }
}
async function refresh() {
  try {
    const [cfg, list] = await Promise.all([api('/config'), api('/tokens')]);
    S.cfg = cfg; S.tokens = list.tokens; S.loadError = null;
  } catch (e) { S.loadError = e.message; }
  S.loaded = true;
  await refreshMine(); render();
}
function current() { const h = location.hash.slice(1); return h.startsWith('t-') ? S.tokens.find((t) => t.mint === h.slice(2)) || { missing: true } : null; }
const page = () => { const h = location.hash.slice(1) || 'tokens'; return h.startsWith('t-') ? 'tokens' : h; };
const progress = (t) => !t.pool ? 0 : t.pool.status !== 0 ? 100 : Math.min(100, t.pool.raisedSol / t.pool.targetSol * 100);
function avatar(t, big) {
  const cls = 'av' + (big ? ' big' : '');
  return t.image && t.image.indexOf(API + '/images/') === 0 ? '<img class="' + cls + '" src="' + esc(t.image) + '" alt="">' : '<span class="' + cls + '" aria-hidden="true">' + esc((t.name || '?')[0]) + '</span>';
}
function status(t) {
  if (!t.pool) return '<span class="pill off">Not readable right now</span>';
  return t.pool.status === 0 ? '<span class="pill curve">On curve, ' + progress(t).toFixed(1) + '%</span>' : t.pool.status === 1 ? '<span class="pill grad">Target reached, moving to pool</span>' : '<span class="pill grad">Graduated</span>';
}


/* ---------- Burn vault and creator panels ---------- */
function vaultPanel(t) {
  const b = t.pool && t.pool.burnpad;
  if (!b) return '<section class="panel"><h3>Burn vault</h3><p class="note">This token was launched before burn vaults existed, so it has none.</p></section>';
  const v = b.vault;
  const state = b.expired ? 'Creator share moved here' : b.graduated ? (v && v.paused ? 'Paused' : 'Open') : 'Opens at graduation';
  return '<section class="panel"><div class="row between"><h3>Burn vault</h3><span class="pill ' + (b.graduated && !b.expired ? 'grad' : 'off') + '">' + state + '</span></div>' +
    '<p class="small muted">Half of the platform fee from every trade of this token collects in its vault. After the token graduates, holders can sell tokens to the vault at a discount, and the vault burns them.</p>' +
    '<dl class="kv"><dt>In the vault</dt><dd>' + fSol(v ? v.sol : 0) + '</dd><dt>Tokens burned</dt><dd>' + fTok(v ? v.burnedTokens : 0) + '</dd><dt>Paid to sellers</dt><dd>' + fSol(v ? v.paidSol : 0) + '</dd>' +
    (v ? '<dt>Bid</dt><dd>' + v.discountPercent + '% under the recent price</dd><dt>Limit per sale</dt><dd>' + v.maxSalePercent + '% of the vault</dd><dt>Limit per day</dt><dd>' + v.dailyPercent + '% of the vault</dd>' : '') +
    '<dt>Fees waiting to be harvested</dt><dd>' + b.pendingFeesSol.toFixed(6) + ' SOL</dd></dl>' +
    '<div class="row">' + (b.pendingFeesSol > 0 ? '<button class="btn sm" data-act="harvest">Harvest fees</button>' : '') +
    (t.pool.status === 2 && !b.graduated && !b.expired ? '<button class="btn sm flame" data-act="graduate">Open the vault</button>' : '') + '</div>' +
    '<p class="small muted">Anyone can harvest fees or open the vault. The vault’s SOL can only ever be paid to holders who sell to it.</p></section>';
}
function creatorPanel(t) {
  const b = t.pool && t.pool.burnpad;
  if (!b || !b.creatorStream) return '';
  const c = b.creatorStream, mine = S.owner && S.owner === b.creator;
  const note = b.expired ? 'The token did not graduate within 30 days, so the creator share went to the burn vault.'
    : b.graduated ? 'Vests evenly over 30 days from graduation.'
    : 'Locked until the token graduates. If it has not graduated by ' + new Date(b.expiresAt * 1000).toLocaleDateString() + ', it goes to the burn vault instead.';
  return '<section class="panel"><h3>Creator share</h3><p class="small muted">' + note + '</p><dl class="kv"><dt>Creator</dt><dd class="mono">' + esc(short(b.creator)) + '</dd><dt>Earned so far</dt><dd>' + fSol(c.totalSol) +
    '</dd><dt>Claimed</dt><dd>' + fSol(c.claimedSol) + '</dd><dt>Ready to claim</dt><dd>' + fSol(c.claimableSol) + '</dd></dl>' +
    '<div class="row">' + (mine ? '<button class="btn sm flame" data-act="claimcreator"' + (c.claimableSol > 0 && !b.expired ? '' : ' disabled') + '>Claim</button>' : '') +
    (b.canExpire ? '<button class="btn sm" data-act="expire">Move to the vault</button>' : '') + '</div></section>';
}
function vquoteHtml() {
  const x = parseFloat(S.vamt);
  if (!(x > 0)) return '<span class="muted">Enter an amount to see the vault’s bid.</span>';
  if (!S.vq || S.vq.amt !== S.vamt) return '<span class="muted">Getting the vault’s bid…</span>';
  if (S.vq.error) return '<span style="color:var(--bad)">' + esc(S.vq.error) + '</span>';
  const q = S.vq.quote;

  if (act === 'expire' && t) return run('Expire creator share', '/tx/expire', { mint: t.mint });
  if (act === 'claimcreator' && t) return run('Claim creator share', '/tx/claim-creator', { mint: t.mint });
  if (act === 'recprice' && t) { const ok = await run('Record the price', '/tx/buy', { mint: t.mint, sol: '0.001' }); if (ok) { S.vq = null; say('Price recorded. Wait about a minute, then retype the amount to get the vault’s bid.', 'good'); } return; }
  if (act === 'vpct' && t) { S.vamt = String(Math.floor((S.held[t.mint] || 0) * v / 100 * 1e6) / 1e6); render(); return; }
  if (act === 'vsell' && t) {
    if (!S.owner) return startConnect();
    if (!(parseFloat(S.vamt) > 0)) return say('Enter an amount to sell to the vault.', 'bad');
    const ok = await run('Sell ' + t.symbol + ' to the vault', '/tx/vault-sell', { mint: t.mint, tokens: S.vamt });
    if (ok) { S.vamt = ''; S.vq = null; render(); }
    return;
  }
  if (act === 'trade' && t) {
    if (!S.owner) return startConnect();
    if (!(parseFloat(S.amt) > 0)) return say('Enter an amount first.', 'bad');
    const ok = await run((S.side === 'buy' ? 'Buy ' : 'Sell ') + t.symbol, S.side === 'buy' ? '/tx/buy' : '/tx/sell', S.side === 'buy' ? { mint: t.mint, sol: S.amt } : { mint: t.mint, tokens: S.amt });
    if (ok && S.side === 'sell') { S.amt = ''; render(); }
  }
});
document.addEventListener('input', (e) => {
  const id = e.target.id;
  if (id === 'q') { S.q = e.target.value; if (page() !== 'tokens' || current()) { location.hash = '#tokens'; return; } if ($('list')) $('list').innerHTML = tokenCards(); }
  else if (id === 'amt') { S.amt = e.target.value; quote(); }
  else if (id === 'vamt') { S.vamt = e.target.value; vquote(); }
  else if (id === 'l-image') {
    const f = e.target.files[0];
    if (S.launch.imageUrl) URL.revokeObjectURL(S.launch.imageUrl);
    S.launch.imageUrl = f ? URL.createObjectURL(f) : '';
    $('launch-preview').innerHTML = launchPreview();
  }
  else if (id.startsWith('l-')) { S.launch[id.slice(2)] = e.target.value; $('launch-preview').innerHTML = launchPreview(); }
});
document.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!S.owner) return startConnect();
  if (e.target.id !== 'launch-form') return;
  const L = S.launch, file = $('l-image').files[0];
  let imageData = null;
  if (file) {
    if (file.size > 2 * 1024 * 1024) return say('The image is larger than 2 MB. Choose a smaller file.', 'bad');
    try { imageData = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error('The image could not be read.')); r.readAsDataURL(file); }); }
    catch (err) { return say(esc(err.message), 'bad'); }
  }
  const built = await launchFlow('Launch ' + L.name, { name: L.name, symbol: L.symbol, description: L.desc, imageData, firstBuySol: L.first || null, targetSol: L.target && parseFloat(L.target) !== 85 ? L.target : null });
  if (built && built.mint) { S.launch = { name: '', symbol: '', desc: '', first: '', target: '85', imageUrl: '' }; location.hash = 't-' + built.mint; }
});
window.addEventListener('hashchange', async () => { S.side = 'buy'; S.amt = '0.1'; S.vamt = ''; S.vq = null; render(); await refreshMine(); render(); });
setInterval(() => { const a = document.activeElement; if (!S.busy && !document.hidden && !(a && /INPUT|TEXTAREA/.test(a.tagName)) && page() !== 'launch') refresh(); }, 20000);

render();
if (API) { refresh(); const w = wallets(); if (w.length) connect(w[0][1], true); }
</script>
</body>
