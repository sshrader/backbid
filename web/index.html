<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Burn Vault Launchpad Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a working bench. Left column is the product as a trader sees it;
   the right rail is the test bench (clock, wallet, parameters). The supply bar with
   its charred end is the one recurring signature element. */
:root {
  --paper: #ECEFED;
  --surface: #FAFBFA;
  --ink: #1A201E;
  --muted: #5C6864;
  --line: #CDD4D0;
  --flame: #1746E0;
  --flame-soft: #E3E9FD;
  --scorch: #B8520A;
  --good: #1B7548;
  --warn: #9A5B00;
  --bad: #B3261E;
  --display: "Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #131719; --surface: #1B2123; --ink: #E7ECEA; --muted: #98A5A1; --line: #323B3E;
    --flame: #86A2FF; --flame-soft: #222C4D; --scorch: #F0943A;
    --good: #5CC08A; --warn: #E0A93A; --bad: #F2776E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #131719; --surface: #1B2123; --ink: #E7ECEA; --muted: #98A5A1; --line: #323B3E;
  --flame: #86A2FF; --flame-soft: #222C4D; --scorch: #F0943A;
  --good: #5CC08A; --warn: #E0A93A; --bad: #F2776E;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 400 15px/1.5 var(--body); }
h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.1; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(28px, 4.2vw, 44px); letter-spacing: -0.02em; }
h2 { font-size: 22px; letter-spacing: -0.01em; }
h3 { font-size: 16px; font-weight: 500; }
p { margin: 0; }
a { color: var(--flame); }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--flame); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

.banner { background: var(--ink); color: var(--paper); padding: 8px 20px; font-size: 13px; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--surface); }
.mark { font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: -0.02em; text-decoration: none; color: var(--ink); }
.mark span { font: 400 12px var(--body); color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.nav { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; }
.nav a { padding: 6px 10px; border-radius: 6px; text-decoration: none; color: var(--ink); font-weight: 500; }
.nav a[aria-current="page"] { background: var(--flame-soft); color: var(--flame); }
.wallet { font-size: 13px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; }

.shell { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; padding: 24px 20px 48px; max-width: 1280px; margin: 0 auto; align-items: start; }
@media (max-width: 960px) { .shell { grid-template-columns: minmax(0, 1fr); } }
main { display: flex; flex-direction: column; gap: 24px; min-width: 0; }

.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--paper); padding: 9px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; }
.btn:hover { filter: brightness(1.15); }
a.btn { text-decoration: none; display: inline-block; }
.btn.flame { background: var(--flame); border-color: var(--flame); color: var(--surface); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 500; }
.btn.sm { padding: 5px 9px; font-size: 13px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.intro { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 28px; align-items: center; }
@media (max-width: 720px) { .intro { grid-template-columns: minmax(0, 1fr); } }
.intro p { max-width: 58ch; }
.intro .lead { display: flex; flex-direction: column; gap: 14px; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stats div { background: var(--surface); padding: 12px 14px; }
.stats b { display: block; font: 700 22px var(--display); }

.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; cursor: pointer; font-weight: 500; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--flame); }

.list { display: flex; flex-direction: column; }
.trow { display: grid; grid-template-columns: minmax(150px, 1.4fr) minmax(150px, 1.6fr) repeat(3, minmax(84px, .7fr)); gap: 14px; align-items: center; padding: 12px 6px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.trow:hover { background: var(--flame-soft); }
.trow.head { color: var(--muted); font-size: 13px; padding-block: 6px; }
.trow.head:hover { background: none; }
@media (max-width: 720px) { .trow { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .trow.head { display: none; } }
.tok { display: flex; gap: 10px; align-items: center; min-width: 0; }
.tok b { display: block; overflow-wrap: anywhere; }
.av { width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center; font: 700 15px var(--display); color: #fff; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; border: 1px solid currentColor; }
.pill.grad { color: var(--good); }
.pill.curve { color: var(--flame); }
.pill.late { color: var(--warn); }

/* Signature: supply bar. Held by traders, still in the curve or pool, and the charred burned end. */
.supply { display: flex; height: 14px; border-radius: 3px; overflow: hidden; background: var(--line); }
.supply.big { height: 30px; border-radius: 5px; }
.supply i { display: block; height: 100%; }
.supply .held { background: var(--ink); }
.supply .res { background: var(--line); }
.supply .burnt { background: repeating-linear-gradient(135deg, var(--scorch) 0 4px, transparent 4px 7px), var(--surface); border-left: 2px solid var(--scorch); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; background: var(--c); }
.prog { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--flame); }

.cols { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 1100px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.stack { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
dl { margin: 0; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 13px; font-weight: 500; }
input[type="text"], input[type="number"], textarea { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 14px; cursor: pointer; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.quote { background: var(--paper); border-radius: 6px; padding: 10px 12px; font-size: 14px; }
.note { border-left: 3px solid var(--warn); padding: 2px 0 2px 10px; font-size: 13px; color: var(--muted); }
.note.bad { border-color: var(--bad); color: var(--bad); }
.note.good { border-color: var(--good); color: var(--good); }
.msg { padding: 10px 14px; border-radius: 6px; background: var(--flame-soft); border: 1px solid var(--flame); }
.msg.bad { background: transparent; border-color: var(--bad); color: var(--bad); }
.log { list-style: none; margin: 0; padding: 0; font-size: 13px; max-height: 240px; overflow: auto; }
.log li { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-bottom: 1px solid var(--line); }
.log .burn { color: var(--scorch); font-weight: 600; }
.spark { width: 100%; height: 64px; display: block; }

.bench { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 16px; }
@media (max-width: 960px) { .bench { position: static; } }
.bench .panel { padding: 14px; gap: 10px; }
.params { display: grid; grid-template-columns: minmax(0, 1fr) 84px; gap: 6px 10px; align-items: center; font-size: 13px; }
.params input { padding: 4px 6px; text-align: right; }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; max-width: 70ch; }
@media (prefers-reduced-motion: no-preference) { .supply i, .prog i { transition: width .35s ease; } }
</style>
</head>
<body>
<div class="banner">Prototype with simulated data. No wallet connects, no transaction is sent, and every token and balance here is an example.</div>
<header class="top">
  <a class="mark" href="#tokens">Burnpad<span>working name</span></a>
  <nav class="nav" id="nav" aria-label="Main"></nav>
  <div class="wallet num" id="wallet"></div>
</header>
<div class="shell">
  <main id="main"></main>
  <aside class="bench" id="bench" aria-label="Test bench"></aside>
</div>

<script>
/* ---------- Model ---------- */
const DEF = { platformFee: 1.25, raydiumFee: 0.25, poolFee: 0.25, splitVault: 50, splitCreator: 25,
  gradTarget: 85, discount: 7.5, perSale: 2, daily: 10, reserve: 0.1, twapMin: 20, guard: 15, vestDays: 30, expiryDays: 30 };
const LIMITS = { platformFee: [0, 5], poolFee: [0, 2], splitVault: [0, 100], splitCreator: [0, 100], gradTarget: [20, 85],
  discount: [0, 50], perSale: [0.1, 100], daily: [0.1, 100], reserve: [0, 5], twapMin: [1, 240], guard: [1, 100], vestDays: [1, 365], expiryDays: [1, 365] };
const LABELS = { platformFee: 'Platform fee on curve, %', poolFee: 'Pool fee routed after graduation, %', splitVault: 'Share to burn vault, %',
  splitCreator: 'Share to creator, %', gradTarget: 'Graduation target, SOL', discount: 'Vault bid discount, %', perSale: 'Max per sale, % of vault',
  daily: 'Daily budget, % of vault', reserve: 'Vault reserve, SOL', twapMin: 'TWAP window, minutes', guard: 'Price guard, %',
  vestDays: 'Creator vesting, days', expiryDays: 'Creator expiry, days' };
const V_SOL = 30, V_TOK = 1.073e9, SUPPLY = 1e9, RENT = 0.0389, DAY = 1440;
let P, S, ui;

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function newToken(name, ticker, desc, hue, ageMin, mine) {
  return { id: ticker.toLowerCase().replace(/[^a-z0-9]/g, '') + (S.tokens.length + 1), name, ticker, desc, hue, mine: !!mine,
    created: S.now - ageMin, vSol: V_SOL, vTok: V_TOK, raised: 0, grad: false, gradAt: 0, pSol: 0, pTok: 0,
    circ: 0, held: 0, burned: 0, vault: 0, winStart: 0, winStartSol: 0, winSpent: 0,
    cAccrued: 0, cClaimed: 0, expired: false, treasury: 0, ray: 0, fees: 0, twap: V_SOL / V_TOK, hist: [V_SOL / V_TOK], log: [] };
}
const spot = t => t.grad ? t.pSol / t.pTok : t.vSol / t.vTok;
function tick(mins) {
  const a = 1 - Math.exp(-mins / P.twapMin);
  for (const t of S.tokens) t.twap += a * (spot(t) - t.twap);
  S.now += mins;
}
function feesOn(t, base) {
  return t.grad ? { plat: base * P.poolFee / 100, ray: 0 } : { plat: base * P.platformFee / 100, ray: base * P.raydiumFee / 100 };
}
function route(t, f) {
  let v = f.plat * P.splitVault / 100, c = f.plat * P.splitCreator / 100;
  const tr = f.plat - v - c;
  if (t.expired) { v += c; c = 0; }
  t.vault += v; t.cAccrued += c; t.treasury += tr; S.treasury += tr; t.ray += f.ray; t.fees += f.plat + f.ray;
}
function note(t, text, kind) { t.log.unshift({ at: S.now, text, kind }); if (t.log.length > 40) t.log.pop(); t.hist.push(spot(t)); if (t.hist.length > 160) t.hist.shift(); }

function quoteBuy(t, solIn) {
  let f = feesOn(t, solIn), net = solIn - f.plat - f.ray, capped = false;
  if (!t.grad) {
    const room = P.gradTarget - t.raised;
    if (net > room) { solIn *= room / net; f = feesOn(t, solIn); net = room; capped = true; }
    return { solIn, f, net, out: t.vTok - (t.vSol * t.vTok) / (t.vSol + net), capped };
  }
  return { solIn, f, net, out: t.pTok - (t.pSol * t.pTok) / (t.pSol + net), capped };
}
function doBuy(t, solIn, who) {
  const q = quoteBuy(t, solIn);
  if (!(q.solIn > 0)) return null;
  if (t.grad) { t.pSol += q.net; t.pTok -= q.out; } else { t.vSol += q.net; t.vTok -= q.out; t.raised += q.net; }
  t.circ += q.out; route(t, q.f);
  if (who === 'you') { S.sol -= q.solIn; t.held += q.out; }
  note(t, (who === 'you' ? 'You bought ' : 'Trader bought ') + fTok(q.out) + ' for ' + fSol(q.solIn));
  if (!t.grad && t.raised >= P.gradTarget - 1e-9) graduate(t);
  return q;
}
function quoteSell(t, tok) {
  const gross = t.grad ? t.pSol - (t.pSol * t.pTok) / (t.pTok + tok) : t.vSol - (t.vSol * t.vTok) / (t.vTok + tok);
  const f = feesOn(t, gross);
  return { gross, f, net: gross - f.plat - f.ray };
}
function doSell(t, tok, who) {
  const q = quoteSell(t, tok);
  if (t.grad) { t.pTok += tok; t.pSol -= q.gross; } else { t.vTok += tok; t.vSol -= q.gross; t.raised -= q.gross; }
  t.circ -= tok; route(t, q.f);
  if (who === 'you') { S.sol += q.net; t.held -= tok; }
  note(t, (who === 'you' ? 'You sold ' : 'Trader sold ') + fTok(tok) + ' for ' + fSol(q.net));
  return q;
}
function graduate(t) {
  const price = spot(t);
  t.grad = true; t.gradAt = S.now; t.pSol = t.raised; t.pTok = t.raised / price;
  t.winStart = S.now; t.winStartSol = t.vault; t.winSpent = 0;
  note(t, 'Graduated to the pool. Burn vault opened with ' + fSol(t.vault), 'burn');
}
function vaultWindow(t) {
  return S.now - t.winStart >= DAY ? { start: S.now, startSol: t.vault, spent: 0 } : { start: t.winStart, startSol: t.winStartSol, spent: t.winSpent };
}
function vaultCheck(t, tok) {
  if (!t.grad) return { ok: false, reason: 'The vault opens when this token graduates.' };
  const sp = spot(t), gap = Math.abs(sp - t.twap) / t.twap * 100;
  const bid = Math.min(sp, t.twap) * (1 - P.discount / 100), w = vaultWindow(t);
  const caps = [['the per-sale cap', t.vault * P.perSale / 100], ['today’s budget', w.startSol * P.daily / 100 - w.spent], ['the SOL reserve', t.vault - P.reserve]];
  caps.sort((a, b) => a[1] - b[1]);
  const cap = Math.max(0, caps[0][1]), r = { bid, gap, cap, maxTok: cap / bid, pay: tok * bid, w, binding: caps[0][0] };
  if (gap > P.guard) return { ...r, ok: false, reason: 'Price guard: spot is ' + gap.toFixed(1) + '% from TWAP, over the ' + P.guard + '% limit. Advance the clock to let TWAP catch up.' };
  if (cap <= 0) return { ...r, ok: false, reason: 'The vault cannot buy right now because of ' + caps[0][0] + '.' };
  if (r.pay > cap + 1e-12) return { ...r, ok: false, reason: 'Too large for ' + caps[0][0] + '. The most it can buy now is ' + fTok(r.maxTok) + '.' };
  return { ...r, ok: tok > 0 };
}
function doVaultSell(t, tok) {
  const c = vaultCheck(t, tok);
  if (!c.ok) return c;
  t.winStart = c.w.start; t.winStartSol = c.w.startSol; t.winSpent = c.w.spent + c.pay;
  t.vault -= c.pay; t.burned += tok; t.circ -= tok; t.held -= tok; S.sol += c.pay;
  note(t, 'Vault bought and burned ' + fTok(tok) + ' for ' + fSol(c.pay), 'burn');
  return c;
}
function creator(t) {
  const vested = t.grad ? t.cAccrued * Math.min(1, (S.now - t.gradAt) / (P.vestDays * DAY)) : 0;
  return { vested, claimable: Math.max(0, vested - t.cClaimed), locked: t.cAccrued - Math.max(vested, t.cClaimed),
    canExpire: !t.grad && !t.expired && S.now - t.created >= P.expiryDays * DAY };
}
function market(t, n, r) {
  for (let i = 0; i < n; i++) {
    const others = t.circ - t.held;
    if (r() < 0.62 || others < 1) { const q = doBuy(t, 0.05 + r() * 1.2, 'other'); if (!q && others >= 1) doSell(t, Math.min(others, 0.5 / spot(t)), 'other'); }
    else doSell(t, Math.min(others, (0.05 + r() * 0.9) / spot(t)), 'other');
    tick(1 + Math.floor(r() * 4));
  }
}

function reset() {
  P = { ...DEF };
  S = { now: 500000, sol: 50, treasury: 0, tokens: [], msg: null, r: rng(7) };
  ui = { tab: 'new', side: 'buy', amt: '1', vaultAmt: '', launch: { name: '', ticker: '', desc: '', first: '' } };
  const seed = [['Kiln Cat', 'KILN', 'A cat that sleeps on the warm side of the kiln.', 18, 5 * DAY, 96, 40],
    ['Pilot Light', 'PILOT', 'Small, steady, always on.', 212, 2 * DAY, 74, 0], ['Ashfall', 'ASH', 'What is left when the rest is gone.', 268, 360, 31, 0],
    ['Tinder', 'TNDR', 'Dry, quick to catch.', 142, 40, 9, 0], ['Slag', 'SLAG', 'Launched a month ago and never caught on.', 330, 31 * DAY, 4, 0],
    ['Flue', 'FLUE', 'Just launched.', 48, 5, 0.6, 0]];
  for (const [name, ticker, desc, hue, age, raise, after] of seed) {
    const t = newToken(name, ticker, desc, hue, age); S.tokens.push(t);
    let left = raise; while (left > 0.01 && !t.grad) { const x = Math.min(left, 0.4 + S.r() * 4); doBuy(t, x, 'other'); left -= x; }
    const now = S.now; market(t, after, S.r); S.now = now;
    if (t.grad) { t.gradAt = S.now - 3 * DAY; t.winStart = S.now; t.winStartSol = t.vault; t.winSpent = 0; }
  }
  for (const t of S.tokens) { t.twap = spot(t); t.log.forEach((l, i) => l.at = S.now - 3 * (i + 1)); }
  doBuy(S.tokens[0], 1.5, 'you'); S.tokens[0].twap = spot(S.tokens[0]); S.sol = 50;
}

/* ---------- Formatting ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fSol = x => (Math.abs(x) >= 100 ? x.toFixed(1) : Math.abs(x) >= 1 ? x.toFixed(2) : x.toFixed(4)) + ' SOL';
const fTok = x => x >= 1e9 ? (x / 1e9).toFixed(2) + 'B' : x >= 1e6 ? (x / 1e6).toFixed(2) + 'M' : x >= 1e3 ? (x / 1e3).toFixed(1) + 'K' : x.toFixed(0);
const fPrice = x => (x * 1e6).toFixed(3);
const pct = x => (x >= 10 ? x.toFixed(0) : x >= 1 || x === 0 ? x.toFixed(1) : x.toFixed(3)) + '%';
const ago = m => m < 60 ? Math.round(m) + ' min' : m < DAY ? (m / 60).toFixed(0) + ' h' : (m / DAY).toFixed(0) + ' d';
const total = t => t.circ + t.burned + (t.grad ? t.pTok : SUPPLY - t.circ - t.burned);
const progress = t => t.grad ? 100 : Math.min(100, t.raised / P.gradTarget * 100);
const av = t => '<span class="av" style="background:hsl(' + t.hue + ' 45% 38%)" aria-hidden="true">' + esc(t.name[0] || '?') + '</span>';
function status(t) {
  if (t.grad) return '<span class="pill grad">Graduated, vault open</span>';
  if (creator(t).canExpire || t.expired) return '<span class="pill late">On curve, past creator deadline</span>';
  return '<span class="pill curve">On curve, ' + pct(progress(t)) + '</span>';
}
function supplyBar(t, big) {
  const T = total(t), b = t.burned / T * 100, h = t.circ / T * 100;
  return '<div class="supply' + (big ? ' big' : '') + '" role="img" aria-label="Supply: ' + pct(h) + ' held by traders, ' + pct(b) + ' burned">' +
    '<i class="held" style="width:' + h + '%"></i><i class="res" style="flex:1"></i>' + (b > 0 ? '<i class="burnt" style="width:' + Math.max(b, 0.6) + '%"></i>' : '') + '</div>';
}
function spark(t) {
  const h = t.hist, lo = Math.min(...h), hi = Math.max(...h), span = hi - lo || 1;
  const pts = h.map((v, i) => (h.length < 2 ? 0 : i / (h.length - 1) * 300).toFixed(1) + ',' + (58 - (v - lo) / span * 52).toFixed(1)).join(' ');
  return '<svg class="spark" viewBox="0 0 300 64" preserveAspectRatio="none" role="img" aria-label="Price over recent trades"><polyline points="' + pts +
    '" fill="none" stroke="var(--flame)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>';
}

function tradeQuote(t) {
  const x = parseFloat(ui.amt);
  if (!(x > 0)) return '<span class="muted">Enter an amount to see a quote.</span>';
  if (ui.side === 'buy') {
    if (x > S.sol) return '<span style="color:var(--bad)">You have ' + fSol(S.sol) + '. Enter a smaller amount.</span>';
    const q = quoteBuy(t, x);
    return 'You pay <b>' + fSol(q.solIn) + '</b> and receive <b>' + fTok(q.out) + ' ' + esc(t.ticker) + '</b>.<br>Fee ' + fSol(q.f.plat + q.f.ray) +
      (t.grad ? ' (pool fee)' : ' (' + (P.platformFee + P.raydiumFee) + '%: ' + fSol(q.f.plat * P.splitVault / 100) + ' of it goes to the burn vault)') +
      (q.capped ? '<br>This buy is trimmed because it fills the curve and graduates the token.' : '');
  }
  if (x > t.held + 1e-9) return '<span style="color:var(--bad)">You hold ' + fTok(t.held) + ' ' + esc(t.ticker) + '. Enter a smaller amount.</span>';
  const q = quoteSell(t, x);
  return 'You sell <b>' + fTok(x) + ' ' + esc(t.ticker) + '</b> and receive <b>' + fSol(q.net) + '</b>.<br>Fee ' + fSol(q.f.plat + q.f.ray) + '. This sale moves the ' + (t.grad ? 'pool' : 'curve') + ' price down.';
}
function vaultQuote(t) {
  const x = parseFloat(ui.vaultAmt), c = vaultCheck(t, x > 0 ? x : 0);
  if (!t.grad) return '<span class="muted">' + c.reason + ' It holds ' + fSol(t.vault) + ' so far.</span>';
  let h = 'Bid <b>' + fPrice(c.bid) + '</b> SOL per 1M. The vault can buy up to <b>' + fTok(c.maxTok) + '</b> right now, limited by ' + c.binding + '.';
  if (x > t.held + 1e-9) return h + '<br><span style="color:var(--bad)">You hold ' + fTok(t.held) + ' ' + esc(t.ticker) + '.</span>';
  if (x > 0 && c.ok) h += '<br>You receive <b>' + fSol(c.pay) + '</b> and ' + fTok(x) + ' ' + esc(t.ticker) + ' is burned. The pool price does not move.';
  else if (c.reason) h += '<br><span style="color:var(--bad)">' + c.reason + '</span>';
  return h;
}

function viewHow() {

    '<li><b>Sell to the vault.</b> The vault bids ' + P.discount + '% below the lower of spot and TWAP. It pays SOL and burns what it buys, within a per-sale cap, a daily budget and a reserve.</li>' +
    '<li><b>Creator vests.</b> The creator’s share unlocks over ' + P.vestDays + ' days. A token that has not graduated after ' + P.expiryDays + ' days sends that share to the vault.</li></ol></section>' +

    '<section class="panel"><h2>Risks to state on the real site</h2><p style="max-width:65ch">The vault may be unable to buy when its budget, cap, reserve or price guard is reached. Its bid comes from a formula and is not a price floor or a guarantee. Tokens like these can go to zero.</p></section>';

function current() { const h = location.hash.slice(1) || 'tokens'; return h.startsWith('t-') ? S.tokens.find(t => t.id === h.slice(2)) || 'tokens' : h; }
function render() {
  const v = current(), page = typeof v === 'object' ? 'tokens' : v;
  document.getElementById('nav').innerHTML = [['tokens', 'Tokens'], ['vaults', 'Burn vaults'], ['launch', 'Launch a token'], ['how', 'How it works']].map(n => '<a href="#' + n[0] + '"' + (page === n[0] ? ' aria-current="page"' : '') + '>' + n[1] + '</a>').join('');
  document.getElementById('wallet').textContent = 'Example wallet: ' + fSol(S.sol);
  const body = typeof v === 'object' ? viewToken(v) : v === 'launch' ? viewLaunch() : v === 'vaults' ? viewVaults() : v === 'how' ? viewHow() : viewTokens();
  document.getElementById('main').innerHTML = (S.msg ? '<div class="msg ' + (S.msg.bad ? 'bad' : '') + '" role="status">' + esc(S.msg.text) + '</div>' : '') + body;
  document.getElementById('bench').innerHTML = benchHTML();
  S.msg = null;
}
const say = (text, bad) => { S.msg = { text, bad }; };

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, v = b.dataset.v, t = current();
  if (act === 'tab') ui.tab = v;
  else if (act === 'side') { ui.side = v; ui.amt = v === 'buy' ? '1' : ''; }
  else if (act === 'time') { tick(+v); say('Clock moved forward ' + ago(+v) + '.'); }
  else if (act === 'reset') { reset(); say('Example data and parameters reset.'); }
  else if (typeof t === 'object') {
    if (act === 'sellpct') ui.amt = String(Math.floor(t.held * v / 100));
    else if (act === 'vaultmax') { const c = vaultCheck(t, 0); ui.vaultAmt = String(Math.floor(Math.min(t.held, (c.maxTok || 0) * 0.999))); }
    else if (act === 'market') { market(t, +v, S.r); say(v + ' simulated trades ran on ' + t.name + '.'); }
    else if (act === 'trade') {
      const x = parseFloat(ui.amt);
      if (!(x > 0)) say('Enter an amount first.', true);
      else if (ui.side === 'buy') { if (x > S.sol) say('You have ' + fSol(S.sol) + '. Enter a smaller amount.', true); else { const was = t.grad, q = doBuy(t, x, 'you'); tick(1); say('Bought ' + fTok(q.out) + ' ' + t.ticker + '.' + (!was && t.grad ? ' That filled the curve: the token graduated and its burn vault is open.' : '')); } }
      else if (x > t.held + 1e-9) say('You hold ' + fTok(t.held) + ' ' + t.ticker + '. Enter a smaller amount.', true);
      else { const q = doSell(t, Math.min(x, t.held), 'you'); tick(1); ui.amt = ''; say('Sold for ' + fSol(q.net) + '.'); }
    }
    else if (act === 'vaultsell') {
      const x = parseFloat(ui.vaultAmt);
      if (!(x > 0)) say('Enter how many tokens to sell to the vault.', true);
      else if (x > t.held + 1e-9) say('You hold ' + fTok(t.held) + ' ' + t.ticker + '.', true);
      else { const c = doVaultSell(t, Math.min(x, t.held)); if (c.ok) { tick(1); ui.vaultAmt = ''; say('Sold to vault for ' + fSol(c.pay) + '. ' + fTok(x) + ' ' + t.ticker + ' burned.'); } else say(c.reason, true); }
    }
    else if (act === 'claim') { const c = creator(t); t.cClaimed += c.claimable; S.sol += c.claimable; note(t, 'Creator claimed ' + fSol(c.claimable)); say('Claimed ' + fSol(c.claimable) + ' as creator.'); }
    else if (act === 'expire') { const amt = t.cAccrued - t.cClaimed; t.vault += amt; t.cAccrued = t.cClaimed; t.expired = true; note(t, 'Creator stream expired. ' + fSol(amt) + ' moved to the burn vault', 'burn'); say('Stream expired. ' + fSol(amt) + ' moved to the burn vault.'); }
  }
  render();
});
document.addEventListener('input', e => {
  const id = e.target.id, t = current();
  if (id === 'trade-amt' && typeof t === 'object') { ui.amt = e.target.value; document.getElementById('trade-quote').innerHTML = tradeQuote(t); }
  else if (id === 'vault-amt' && typeof t === 'object') { ui.vaultAmt = e.target.value; document.getElementById('vault-quote').innerHTML = vaultQuote(t); }
  else if (id.startsWith('l-')) { ui.launch[id.slice(2)] = e.target.value; document.getElementById('launch-preview').innerHTML = launchPreview(); }
});
document.addEventListener('change', e => {
  const k = e.target.dataset.param; if (!k) return;
  let x = parseFloat(e.target.value); if (!isFinite(x)) x = DEF[k];
  x = Math.min(LIMITS[k][1], Math.max(LIMITS[k][0], x));
  if (k === 'splitVault') P.splitCreator = Math.min(P.splitCreator, 100 - x);
  if (k === 'splitCreator') x = Math.min(x, 100 - P.splitVault);
  P[k] = x; say(LABELS[k].replace(/, .*/, '') + ' set to ' + x + '.'); render();
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const L = ui.launch, first = parseFloat(L.first) > 0 ? parseFloat(L.first) : 0, name = L.name.trim(), ticker = L.ticker.trim().toUpperCase();
  if (!name || !ticker) { say('Give the token a name and a ticker.', true); return render(); }
  if (RENT + first > S.sol) { say('You have ' + fSol(S.sol) + '. Lower the first buy.', true); return render(); }
  const t = newToken(name, ticker, L.desc.trim(), Math.floor(S.r() * 360), 0, true);
  t.id = 'u' + (S.tokens.length + 1); S.tokens.push(t); S.sol -= RENT;
  note(t, 'Token launched');
  if (first) doBuy(t, first, 'you');
  tick(1); ui.launch = { name: '', ticker: '', desc: '', first: '' }; say(name + ' launched.' + (t.grad ? ' Your first buy filled the curve and it graduated.' : ''));
  location.hash = 't-' + t.id; render();
});
window.addEventListener('hashchange', () => { ui.side = 'buy'; ui.amt = '1'; ui.vaultAmt = ''; render(); window.scrollTo(0, 0); });
reset(); render();
</script>
</body>
