<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launchpad on Devnet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Blackout: a neutral black, no blue. Warm white ink, sodium-yellow for the one action
   that matters, orange reserved for burning. Slab headlines over a plain sans.
   Single dark theme by choice. Layout: left-aligned, one main column, trade box beside detail. */
:root {
  --paper: #0B0B0C;
  --surface: #151516;
  --raised: #1E1E20;
  --ink: #F3F0EA;
  --muted: #9B968D;
  --line: #2B2A29;
  --flame: #FFC43D;
  --flame-soft: #2B2410;
  --scorch: #FF7A45;
  --good: #7BD389;
  --bad: #FF8A80;
  --display: "Zilla Slab", Rockwell, Georgia, serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 400 15px/1.5 var(--body); }
h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: clamp(30px, 4.4vw, 48px); } h2 { font-size: 22px; } h3 { font-size: 17px; font-weight: 500; }
p { margin: 0; } a { color: var(--flame); }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--flame); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; } .muted { color: var(--muted); } .small { font-size: 13px; }
.mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; overflow-wrap: anywhere; }

.banner { background: var(--flame); color: #14110A; padding: 7px 20px; font-size: 13px; font-weight: 500; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.mark { font: 700 21px var(--display); text-decoration: none; color: var(--ink); }
.mark span { font: 400 12px var(--body); color: var(--muted); margin-left: 6px; }
.nav { display: flex; flex-wrap: wrap; gap: 2px; flex: 1; }
.nav a { padding: 6px 10px; border-radius: 8px; text-decoration: none; color: var(--muted); font-weight: 500; }
.nav a:hover { color: var(--ink); }
.nav a[aria-current="page"] { background: var(--raised); color: var(--ink); }

main { max-width: 1120px; margin: 0 auto; padding: 28px 20px 64px; display: flex; flex-direction: column; gap: 24px; }
.btn { border: 1px solid var(--line); background: var(--raised); color: var(--ink); padding: 9px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
.btn:hover { border-color: var(--muted); }
.btn.flame { background: var(--flame); border-color: var(--flame); color: #14110A; }
.btn.flame:hover { filter: brightness(1.08); }
.btn.sm { padding: 5px 10px; font-size: 13px; font-weight: 500; }
.btn[disabled] { opacity: .4; cursor: not-allowed; filter: none; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 24px; min-width: 0; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.hero { display: flex; flex-direction: column; gap: 16px; padding: 12px 0 4px; }
.hero p { max-width: 60ch; color: var(--muted); font-size: 17px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.stats div { background: var(--surface); padding: 14px 16px; color: var(--muted); }
.stats b { display: block; font: 700 24px var(--display); color: var(--ink); }

.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; cursor: pointer; font-weight: 500; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--flame); }
.trow { display: grid; grid-template-columns: minmax(170px, 1.5fr) minmax(160px, 1.5fr) repeat(2, minmax(90px, .7fr)); gap: 16px; align-items: center; padding: 13px 8px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); border-radius: 8px; }
a.trow:hover { background: var(--raised); }
.trow.head { color: var(--muted); font-size: 13px; padding-block: 6px; }
@media (max-width: 700px) { .trow { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .trow.head { display: none; } }
.tok { display: flex; gap: 12px; align-items: center; min-width: 0; } .tok b { display: block; overflow-wrap: anywhere; }
.av { width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center; font: 700 17px var(--display); background: var(--raised); border: 1px solid var(--line); object-fit: cover; }
.av.big { width: 64px; height: 64px; font-size: 26px; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; border: 1px solid currentColor; }
.pill.grad { color: var(--good); } .pill.curve { color: var(--flame); } .pill.off { color: var(--muted); }
.prog { height: 8px; background: var(--raised); border-radius: 4px; overflow: hidden; } .prog.big { height: 14px; border-radius: 7px; }
.prog i { display: block; height: 100%; background: var(--flame); }

.cols { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 900px) { .cols { grid-template-columns: minmax(0, 1fr); } }
dl { margin: 0; } .kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 7px 16px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.field { display: flex; flex-direction: column; gap: 5px; } .field label { font-size: 13px; font-weight: 500; color: var(--muted); }
input[type="text"], input[type="number"], input[type="url"], input[type="file"], textarea { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; width: 100%; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 16px; cursor: pointer; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.quote { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 14px; min-height: 44px; }
.note { border-left: 3px solid var(--scorch); padding: 2px 0 2px 12px; font-size: 14px; color: var(--muted); }
.msg { padding: 11px 14px; border-radius: 8px; background: var(--flame-soft); border: 1px solid var(--flame); overflow-wrap: anywhere; }
.msg.bad { background: transparent; border-color: var(--bad); color: var(--bad); }
.msg.good { background: transparent; border-color: var(--good); color: var(--good); }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; max-width: 68ch; }
@media (prefers-reduced-motion: no-preference) { .prog i { transition: width .4s ease; } }
</style>
</head>
<body>
<div class="banner">Running on Solana devnet. Tokens and SOL here are test assets with no value.</div>
<header class="top">
  <a class="mark" href="#tokens">Burnpad<span>working name</span></a>
  <nav class="nav" id="nav" aria-label="Main"></nav>
  <div class="row" id="wallet"></div>
</header>
<main>
  <div id="msg" role="status" aria-live="polite"></div>
  <div id="view" class="stack"></div>
</main>

<script src="config.js"></script>
<script src="https://unpkg.com/@solana/web3.js@1.95.3/lib/index.iife.min.js"></script>
<script>
const API = (window.API_URL || '').replace(/\/$/, '');
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fSol = (x) => (Math.abs(x) >= 100 ? x.toFixed(1) : Math.abs(x) >= 1 ? x.toFixed(2) : x.toFixed(4)) + ' SOL';
const fTok = (x) => x >= 1e9 ? (x / 1e9).toFixed(2) + 'B' : x >= 1e6 ? (x / 1e6).toFixed(2) + 'M' : x >= 1e3 ? (x / 1e3).toFixed(1) + 'K' : (+x).toFixed(x < 10 && x > 0 ? 2 : 0);
const fPrice = (x) => x == null ? 'n/a' : (x * 1e6).toFixed(4);
const short = (a) => a.slice(0, 4) + '…' + a.slice(-4);
const ago = (ms) => { const m = (Date.now() - ms) / 60000; return m < 1 ? 'just now' : m < 60 ? Math.round(m) + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' d ago'; };
const explorer = (kind, id) => 'https://explorer.solana.com/' + kind + '/' + encodeURIComponent(id) + '?cluster=devnet';

let S = { cfg: null, tokens: [], loaded: false, loadError: null, owner: null, sol: null, held: {}, tab: 'new', side: 'buy', amt: '0.1', busy: false, launch: { name: '', symbol: '', desc: '', first: '', imageUrl: '' } };
let wallet = null, quoteTimer = null, quoteSeq = 0;

/* ---------- API and wallet ---------- */
async function api(path, body) {
  let res;
  try { res = await fetch(API + path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : undefined); }
  catch (e) { throw new Error('Could not reach the server. Check your connection and try again.'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'The server returned an error (' + res.status + ').');
  return data;
}
function say(html, kind) { $('msg').innerHTML = html ? '<div class="msg ' + (kind || '') + '">' + html + '</div>' : ''; if (html) window.scrollTo({ top: 0, behavior: 'smooth' }); }
function wallets() {
  const list = [];
  if (window.phantom && window.phantom.solana) list.push(['Phantom', window.phantom.solana]);
  if (window.solflare && window.solflare.isSolflare) list.push(['Solflare', window.solflare]);
  if (window.backpack && window.backpack.solana) list.push(['Backpack', window.backpack.solana]);
  return list;
}
async function connect(provider, quiet) {
  try {
    const r = await provider.connect(quiet ? { onlyIfTrusted: true } : undefined);
    wallet = provider; S.owner = ((r && r.publicKey) || provider.publicKey).toString();
    if (!quiet) say('');
    await refreshMine(); render();
  } catch (e) { if (!quiet) say('The wallet did not connect: ' + esc(e.message || e), 'bad'); }
}
function startConnect() {
  const list = wallets();
  if (!list.length) return say('No Solana wallet found in this browser. Install Phantom, Solflare or Backpack, then reload this page.', 'bad');
  if (list.length === 1) return connect(list[0][1]);
  say('Choose a wallet: ' + list.map((w, i) => '<button class="btn sm" data-act="pick" data-v="' + i + '">' + w[0] + '</button>').join(' '));
}
const fromB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const toB64 = (bytes) => { let s = ''; bytes.forEach((b) => (s += String.fromCharCode(b))); return btoa(s); };

/* Ask the server for unsigned transactions, sign in the wallet, hand back to be sent. */
async function run(label, path, body) {
  if (S.busy) return null;
  if (!S.owner) { say('Connect your wallet first.', 'bad'); return null; }
  S.busy = true;
  try {
    say(esc(label) + ': preparing the transaction…');
    const built = await api(path, { owner: S.owner, ...body });
    say(esc(label) + ': approve it in your wallet. If no window appears, click the wallet’s icon in your browser toolbar.');
    const txs = built.transactions.map((b) => solanaWeb3.VersionedTransaction.deserialize(fromB64(b)));
    const signed = txs.length > 1 ? await wallet.signAllTransactions(txs) : [await wallet.signTransaction(txs[0])];
    say(esc(label) + ': sending to devnet and waiting for confirmation…');
    const sent = await api('/tx/send', { transactions: signed.map((t) => toB64(t.serialize())), mint: built.mint, platformId: built.platformId });
    say(esc(label) + ' confirmed. ' + sent.signatures.map((s) => '<a href="' + explorer('tx', s) + '" rel="noopener">View on Solana Explorer</a>').join(' '), 'good');
    S.busy = false;
    await refresh();
    return built;
  } catch (e) {
    say(esc(e && e.message ? e.message : e), 'bad');
    return null;
  } finally { S.busy = false; }
}

/* ---------- Data ---------- */
async function refreshMine() {
  if (!S.owner) return;
  try {
    const t = current();
    const b = await api('/balance?owner=' + encodeURIComponent(S.owner) + (t && t.mint ? '&mint=' + encodeURIComponent(t.mint) : ''));
    S.sol = b.sol; if (t && t.mint && b.tokens != null) S.held[t.mint] = b.tokens;
  } catch (e) { /* balance is a convenience */ }
}
async function refresh() {
  try {
    const [cfg, list] = await Promise.all([api('/config'), api('/tokens')]);
    S.cfg = cfg; S.tokens = list.tokens; S.loadError = null;
  } catch (e) { S.loadError = e.message; }
  S.loaded = true;
  await refreshMine(); render();
}
function current() { const h = location.hash.slice(1); return h.startsWith('t-') ? S.tokens.find((t) => t.mint === h.slice(2)) || { missing: true } : null; }
const page = () => { const h = location.hash.slice(1) || 'tokens'; return h.startsWith('t-') ? 'tokens' : h; };
const progress = (t) => !t.pool ? 0 : t.pool.status !== 0 ? 100 : Math.min(100, t.pool.raisedSol / t.pool.targetSol * 100);
function avatar(t, big) {
  const cls = 'av' + (big ? ' big' : '');
  return t.image && t.image.indexOf(API + '/images/') === 0 ? '<img class="' + cls + '" src="' + esc(t.image) + '" alt="">' : '<span class="' + cls + '" aria-hidden="true">' + esc((t.name || '?')[0]) + '</span>';
}
function status(t) {
  if (!t.pool) return '<span class="pill off">Not readable right now</span>';
  return t.pool.status === 0 ? '<span class="pill curve">On curve, ' + progress(t).toFixed(1) + '%</span>' : '<span class="pill grad">Graduated</span>';
}

/* ---------- Views ---------- */
function viewTokens() {
  const tk = S.tokens;
  const sets = { new: tk.slice().sort((a, b) => b.createdAt - a.createdAt), raised: tk.slice().sort((a, b) => (b.pool ? b.pool.raisedSol : 0) - (a.pool ? a.pool.raisedSol : 0)),
    soon: tk.filter((t) => t.pool && t.pool.status === 0 && progress(t) >= 50).sort((a, b) => progress(b) - progress(a)), graduated: tk.filter((t) => t.pool && t.pool.status !== 0) };
  const names = { new: 'New', raised: 'Most raised', soon: 'About to graduate', graduated: 'Graduated' };
  const empty = { new: 'No tokens yet. Launch the first one.', raised: 'No tokens yet. Launch the first one.', soon: 'No token is past the halfway mark yet.', graduated: 'No token has reached its graduation target yet.' };
  const rows = sets[S.tab].map((t) => '<a class="trow" href="#t-' + esc(t.mint) + '"><span class="tok">' + avatar(t) + '<span><b>' + esc(t.name) + '</b><span class="muted small">' + esc(t.symbol) + ', ' + ago(t.createdAt) +
    '</span></span></span><span>' + status(t) + '<div class="prog" style="margin-top:7px"><i style="width:' + progress(t) + '%"></i></div></span><span class="num">' + (t.pool ? fPrice(t.pool.price) : 'n/a') +
    '</span><span class="num">' + (t.pool ? fSol(t.pool.raisedSol) : 'n/a') + '</span></a>').join('');
  return '<section class="hero"><h1>Launch a token on Raydium in one transaction.</h1><p>Each token starts on a bonding curve and moves to a Raydium pool with locked liquidity when it reaches its target. A burn vault that buys tokens back and destroys them is in development.</p>' +
    '<div class="row"><a class="btn flame" href="#launch">Launch a token</a><a class="btn" href="#how">How it works</a></div></section>' +
    '<section class="stats num" aria-label="Totals"><div><b>' + tk.length + '</b>Tokens launched</div><div><b>' + tk.filter((t) => t.pool && t.pool.status !== 0).length + '</b>Graduated</div><div><b>' +
    tk.reduce((s, t) => s + (t.pool ? t.pool.raisedSol : 0), 0).toFixed(2) + '</b>SOL on curves</div></section>' +
    '<section class="panel"><h2>Tokens</h2><div class="tabs" role="tablist">' + Object.keys(names).map((k) => '<button role="tab" aria-selected="' + (S.tab === k) + '" data-act="tab" data-v="' + k + '">' + names[k] + '</button>').join('') + '</div>' +
    (S.loadError ? '<p class="muted">' + esc(S.loadError) + '</p>' : !S.loaded ? '<p class="muted">Loading tokens…</p>' :
      '<div><div class="trow head"><span>Token</span><span>Progress to graduation</span><span>Price, SOL per 1M</span><span>Raised</span></div>' + (rows || '<p class="muted" style="padding:16px 8px">' + empty[S.tab] + '</p>') + '</div>') + '</section>';
}
function viewToken(t) {
  if (t.missing) return '<p><a href="#tokens">All tokens</a></p><section class="panel"><h2>Token not found</h2><p class="muted">' + (S.loaded ? 'This address is not a token launched here.' : 'Loading…') + '</p></section>';
  const p = t.pool, live = p && p.status === 0, held = S.held[t.mint], fee = S.cfg && S.cfg.platform && S.cfg.platform.feePercent;
  const left = '<div class="stack"><section class="panel"><div class="row between"><span class="tok">' + avatar(t, true) + '<span><h2>' + esc(t.name) + '</h2><span class="muted">' + esc(t.symbol) + ', launched ' + ago(t.createdAt) + '</span></span></span>' + status(t) + '</div>' +
    (t.description ? '<p>' + esc(t.description) + '</p>' : '') +
    '<div class="row"><span class="mono muted">' + esc(t.mint) + '</span><button class="btn sm" data-act="copy" data-v="' + esc(t.mint) + '">Copy address</button><a class="btn sm" href="' + explorer('address', t.mint) + '" rel="noopener">Solana Explorer</a></div></section>' +
    (p ? '<section class="panel"><h3>Bonding curve</h3><div class="prog big"><i style="width:' + progress(t) + '%"></i></div><dl class="kv"><dt>Raised toward graduation</dt><dd>' + fSol(p.raisedSol) + ' of ' + p.targetSol + '</dd><dt>Price, SOL per 1M tokens</dt><dd>' + fPrice(p.price) +
      '</dd><dt>Sold from the curve</dt><dd>' + fTok(p.soldTokens) + ' of ' + fTok(p.curveTokens) + '</dd><dt>Total supply</dt><dd>' + fTok(p.supply) + '</dd><dt>Creator</dt><dd class="mono">' + esc(short(p.creator)) + '</dd></dl></section>' : '') +
    '<section class="panel"><h3>Burn vault</h3><p class="note">Not live yet. In the full design, part of every trading fee collects in a vault for this token, and after graduation the vault buys tokens from holders and burns them.</p></section></div>';
  const right = '<div class="stack"><section class="panel">' + (!p ? '<h3>Trade</h3><p class="muted">This token’s pool could not be read just now. Try again in a moment.</p>' :
    !live ? '<h3>Trade</h3><p class="note">This token has graduated to a Raydium pool. Trading it from this page is not built yet.</p>' :
    '<div class="row between"><h3>Trade on the curve</h3><div class="seg"><button aria-pressed="' + (S.side === 'buy') + '" data-act="side" data-v="buy">Buy</button><button aria-pressed="' + (S.side === 'sell') + '" data-act="side" data-v="sell">Sell</button></div></div>' +
    '<div class="field"><label for="amt">' + (S.side === 'buy' ? 'Amount in SOL' : 'Amount in ' + esc(t.symbol)) + '</label><input type="number" id="amt" min="0" step="any" value="' + esc(S.amt) + '"></div>' +
    (S.side === 'sell' && held ? '<div class="row"><button class="btn sm" data-act="pct" data-v="25">25%</button><button class="btn sm" data-act="pct" data-v="50">50%</button><button class="btn sm" data-act="pct" data-v="100">All</button></div>' : '') +
    '<div class="quote" id="quote"><span class="muted">Enter an amount to see a quote.</span></div>' +
    '<button class="btn flame" data-act="trade">' + (S.owner ? (S.side === 'buy' ? 'Buy ' : 'Sell ') + esc(t.symbol) : 'Connect wallet to trade') + '</button>' +
    '<p class="small muted">' + (S.owner ? 'You hold ' + (held == null ? '0' : fTok(held)) + ' ' + esc(t.symbol) + ' and ' + (S.sol == null ? 'n/a' : fSol(S.sol)) + '.' : '') + ' Trades allow 1% slippage. Fees: ' + (fee == null ? 'platform fee' : fee + '% platform') + ' plus 0.25% Raydium.</p>') +
    '</section></div>';
  return '<p><a href="#tokens">All tokens</a></p><div class="cols">' + left + right + '</div>';
}
function launchPreview() {
  const L = S.launch;
  return '<span class="tok">' + (L.imageUrl ? '<img class="av big" src="' + esc(L.imageUrl) + '" alt="">' : '<span class="av big" aria-hidden="true">' + esc((L.name || 'M')[0]) + '</span>') + '<span><b>' + esc(L.name || 'My token') + '</b><span class="muted small">' + esc((L.symbol || 'TICKER').toUpperCase()) + '</span></span></span>' +
    '<p class="small">' + esc(L.desc || 'Your description shows here.') + '</p><dl class="kv small"><dt>First buy</dt><dd>' + (parseFloat(L.first) > 0 ? fSol(parseFloat(L.first)) : 'None') + '</dd><dt>Account rent and network fee</dt><dd>Shown in your wallet</dd></dl>';
}
function viewLaunch() {
  const L = S.launch, has = S.cfg && S.cfg.platformId, fee = S.cfg && S.cfg.platform && S.cfg.platform.feePercent;
  return '<h1>Launch a token</h1>' + (S.loaded && !has ? '<p class="msg bad">The platform is not registered yet. <a href="#platform">Register it first</a>.</p>' : '') +
    '<div class="cols"><form class="panel" id="launch-form"><div class="field"><label for="l-name">Name</label><input type="text" id="l-name" maxlength="32" value="' + esc(L.name) + '" required></div>' +
    '<div class="field"><label for="l-symbol">Ticker</label><input type="text" id="l-symbol" maxlength="10" value="' + esc(L.symbol) + '" required></div>' +
    '<div class="field"><label for="l-desc">Description, optional</label><textarea id="l-desc" rows="3" maxlength="500">' + esc(L.desc) + '</textarea></div>' +
    '<div class="field"><label for="l-image">Image, optional. PNG, JPG, WebP or GIF up to 2 MB</label><input type="file" id="l-image" accept="image/png,image/jpeg,image/webp,image/gif"></div>' +
    '<div class="field"><label for="l-first">First buy in SOL, optional</label><input type="number" id="l-first" min="0" step="any" value="' + esc(L.first) + '"><span class="small muted">You are the first buyer on the curve, in the same transaction.</span></div>' +
    '<button class="btn flame" type="submit">' + (S.owner ? 'Launch token' : 'Connect wallet to launch') + '</button><p class="small muted">The name, ticker and image are written into the token and cannot be changed later.</p></form>' +
    '<div class="stack"><section class="panel"><h3>Preview</h3><div class="stack" style="gap:12px" id="launch-preview">' + launchPreview() + '</div></section>' +
    '<section class="panel"><h3>Every trade of this token</h3><dl class="kv"><dt>Platform fee</dt><dd>' + (fee == null ? 'n/a' : fee + '%') + '</dd><dt>Raydium protocol fee</dt><dd>0.25%</dd><dt>Creator fee</dt><dd>0%</dd><dt>Graduates to a Raydium pool at</dt><dd>85 SOL, liquidity locked</dd></dl></section></div></div>';
}
function viewPlatform() {
  const c = S.cfg, ps = c && c.platform;
  if (!S.loaded) return '<h1>Platform</h1><p class="muted">Loading…</p>';
  if (S.loadError) return '<h1>Platform</h1><p class="msg bad">' + esc(S.loadError) + '</p>';
  if (!c.platformId) return '<h1>Platform</h1><div class="cols"><form class="panel" id="plat-form"><h3>Register this launchpad on Raydium LaunchLab</h3><div class="field"><label for="p-name">Platform name</label><input type="text" id="p-name" maxlength="60" required></div>' +
    '<div class="field"><label for="p-web">Website, optional</label><input type="url" id="p-web" placeholder="https://"></div><div class="field"><label for="p-fee">Platform fee, percent per trade</label><input type="number" id="p-fee" min="0" max="5" step="0.05" value="1.25"></div>' +
    '<button class="btn flame" type="submit">Register platform</button><p class="small muted">A wallet can register one platform. The wallet that signs becomes its admin and receives its fees.</p></form></div>';
  return '<h1>Platform</h1><div class="cols"><section class="panel"><h3>Registered on devnet</h3><p class="mono">' + esc(c.platformId) + '</p><dl class="kv"><dt>Platform fee per trade</dt><dd>' + (ps && ps.feePercent != null ? ps.feePercent + '%' : 'n/a') +
    '</dd><dt>Fees ready to claim</dt><dd>' + (ps ? Number(ps.claimableSol).toFixed(6) + ' SOL' : 'n/a') + '</dd></dl><div class="row"><button class="btn flame" data-act="claim"' + (ps && ps.claimableSol > 0 ? '' : ' disabled') + '>Claim platform fees</button>' +
    '<a class="btn" href="' + explorer('address', c.platformId) + '" rel="noopener">Solana Explorer</a></div><p class="small muted">Only the platform’s fee wallet can claim. Fees arrive as wrapped SOL, shown as a separate token in your wallet.</p></section></div>';
}
function viewHow() {
  return '<h1>How it works</h1><section class="panel"><ol class="steps"><li><b>Launch.</b> One transaction creates the token on Raydium’s LaunchLab bonding curve. You sign it in your own wallet.</li>' +
    '<li><b>Trade on the curve.</b> Buys raise the price and sells lower it. Each trade pays the platform fee plus Raydium’s 0.25%.</li>' +
    '<li><b>Graduate.</b> At 85 SOL raised, Raydium moves the token to a pool and locks its liquidity for good.</li></ol></section>' +
    '<section class="panel"><h2>In development</h2><p style="max-width:65ch">The burn vault and the creator fee stream are designed but not built. Try the mechanics with made-up numbers in the <a href="prototype.html">simulator</a>.</p></section>' +
    '<section class="panel"><h2>Risk</h2><p style="max-width:65ch">This is test software on a test network. Tokens like these are highly volatile and can go to zero. Nothing here is financial advice.</p></section>';
}

/* ---------- Shell ---------- */
function render() {
  if (!API) { $('view').innerHTML = '<section class="panel"><h2>Not connected to a server</h2><p class="muted">Set the server address in config.js, then reload.</p></section>'; return; }
  const t = current(), pg = page();
  $('nav').innerHTML = [['tokens', 'Tokens'], ['launch', 'Launch'], ['platform', 'Platform'], ['how', 'How it works']].map((n) => '<a href="#' + n[0] + '"' + (pg === n[0] ? ' aria-current="page"' : '') + '>' + n[1] + '</a>').join('') + '<a href="prototype.html">Simulator</a>';
  $('wallet').innerHTML = S.owner ? '<span class="small num muted">' + (S.sol == null ? '' : fSol(S.sol)) + '</span><span class="btn sm mono" title="' + esc(S.owner) + '">' + esc(short(S.owner)) + '</span>' : '<button class="btn flame sm" data-act="connect">Connect wallet</button>';
  $('view').innerHTML = t ? viewToken(t) : pg === 'launch' ? viewLaunch() : pg === 'platform' ? viewPlatform() : pg === 'how' ? viewHow() : viewTokens();
  if (t && !t.missing) quote();
}
function quote() {
  const t = current(), box = $('quote');
  if (!box || !t || !t.pool || t.pool.status !== 0) return;
  clearTimeout(quoteTimer);
  const x = parseFloat(S.amt), held = S.held[t.mint] || 0;
  if (!(x > 0)) { box.innerHTML = '<span class="muted">Enter an amount to see a quote.</span>'; return; }
  if (S.owner && S.side === 'buy' && S.sol != null && x > S.sol) { box.innerHTML = '<span style="color:var(--bad)">You have ' + fSol(S.sol) + '. Enter a smaller amount.</span>'; return; }
  if (S.owner && S.side === 'sell' && x > held) { box.innerHTML = '<span style="color:var(--bad)">You hold ' + fTok(held) + ' ' + esc(t.symbol) + '. Enter a smaller amount.</span>'; return; }
  box.innerHTML = '<span class="muted">Getting a quote…</span>';
  const seq = ++quoteSeq;
  quoteTimer = setTimeout(async () => {
    try {
      const q = await api('/quote', { mint: t.mint, side: S.side, amount: S.amt });
      if (seq !== quoteSeq || !$('quote')) return;
      $('quote').innerHTML = S.side === 'buy' ? 'You pay <b>' + fSol(x) + '</b> and receive about <b>' + fTok(q.tokens) + ' ' + esc(t.symbol) + '</b>, after fees.' : 'You sell <b>' + fTok(x) + ' ' + esc(t.symbol) + '</b> and receive about <b>' + fSol(q.sol) + '</b>, after fees.';
    } catch (e) { if (seq === quoteSeq && $('quote')) $('quote').innerHTML = '<span style="color:var(--bad)">' + esc(e.message) + '</span>'; }
  }, 350);
}

document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, v = b.dataset.v, t = current();
  if (act === 'connect') return startConnect();
  if (act === 'pick') return connect(wallets()[+v][1]);
  if (act === 'tab') { S.tab = v; return render(); }
  if (act === 'side') { S.side = v; S.amt = v === 'buy' ? '0.1' : ''; return render(); }
  if (act === 'pct' && t) { S.amt = String(Math.floor((S.held[t.mint] || 0) * v / 100 * 1e6) / 1e6); return render(); }
  if (act === 'copy') { try { await navigator.clipboard.writeText(v); b.textContent = 'Copied'; } catch (err) { b.textContent = 'Copy failed'; } return; }
  if (act === 'claim') return run('Claim platform fees', '/tx/claim-fees', {});
  if (act === 'trade' && t) {
    if (!S.owner) return startConnect();
    if (!(parseFloat(S.amt) > 0)) return say('Enter an amount first.', 'bad');
    const ok = await run((S.side === 'buy' ? 'Buy ' : 'Sell ') + t.symbol, S.side === 'buy' ? '/tx/buy' : '/tx/sell', S.side === 'buy' ? { mint: t.mint, sol: S.amt } : { mint: t.mint, tokens: S.amt });
    if (ok && S.side === 'sell') { S.amt = ''; render(); }
  }
});
document.addEventListener('input', (e) => {
  const id = e.target.id;
  if (id === 'amt') { S.amt = e.target.value; quote(); }
  else if (id === 'l-image') {
    const f = e.target.files[0];
    if (S.launch.imageUrl) URL.revokeObjectURL(S.launch.imageUrl);
    S.launch.imageUrl = f ? URL.createObjectURL(f) : '';
    $('launch-preview').innerHTML = launchPreview();
  }
  else if (id.startsWith('l-')) { S.launch[id.slice(2)] = e.target.value; $('launch-preview').innerHTML = launchPreview(); }
});
document.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!S.owner) return startConnect();
  if (e.target.id === 'plat-form') return run('Register platform', '/tx/create-platform', { name: $('p-name').value, web: $('p-web').value, feePercent: $('p-fee').value });
  if (e.target.id !== 'launch-form') return;
  const L = S.launch, file = $('l-image').files[0];
  let imageData = null;
  if (file) {
    if (file.size > 2 * 1024 * 1024) return say('The image is larger than 2 MB. Choose a smaller file.', 'bad');
    try { imageData = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error('The image could not be read.')); r.readAsDataURL(file); }); }
    catch (err) { return say(esc(err.message), 'bad'); }
  }
  const built = await run('Launch ' + L.name, '/tx/launch', { name: L.name, symbol: L.symbol, description: L.desc, imageData, firstBuySol: L.first || null });
  if (built && built.mint) { S.launch = { name: '', symbol: '', desc: '', first: '', imageUrl: '' }; location.hash = 't-' + built.mint; }
});
window.addEventListener('hashchange', async () => { S.side = 'buy'; S.amt = '0.1'; render(); await refreshMine(); render(); });
setInterval(() => { const a = document.activeElement; if (!S.busy && !document.hidden && !(a && /INPUT|TEXTAREA/.test(a.tagName)) && page() !== 'launch') refresh(); }, 20000);

render();
if (API) { refresh(); const w = wallets(); if (w.length) connect(w[0][1], true); }
</script>
</body>
</html>
